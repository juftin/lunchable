[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[dependency-groups]
dev = [
  "flake8>=4.0.0",
  "mypy>=1.5",
  "pytest>=7.2.1",
  "pytest-cov>=2.8.1",
  "tox>=3.9.0",
  "types-python-dateutil>=2.8.19.14"
]

[project]
authors = [
  {name = "OpenAPI Generator Community", email = "devsupport@lunchmoney.app"}
]
dependencies = [
  "urllib3 (>=2.1.0,<3.0.0)",
  "python-dateutil (>=2.8.2)",
  "pydantic (>=2)",
  "typing-extensions (>=4.7.1)"
]
description = "Lunch Money API - v2"
keywords = ["OpenAPI", "OpenAPI-Generator", "Lunch Money API - v2"]
license = {text = "Apache 2.0"}
name = "lunchable"
readme = "README.md"
requires-python = ">=3.9"
version = "1.0.0"

[project.urls]
Repository = "https://github.com/juftin/lunchable"

[tool.mypy]
# # Strongly recommend enabling this one as soon as you can
check_untyped_defs = true
disallow_any_generics = true
# # These shouldn't be too much additional work, but may be tricky to
# # get passing if you use a lot of untyped libraries
disallow_subclassing_any = true
disallow_untyped_decorators = true
extra_checks = true
files = [
  "lunchable",
  # "test",  # auto-generated tests
  "tests"  # hand-written tests
]
# # Getting these passing should be easy
strict_equality = true
warn_redundant_casts = true
# List from: https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
module = [
  "lunchable.configuration"
]
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
flake8 = ">= 4.0.0"
mypy = ">= 1.5"
pytest = ">= 7.2.1"
pytest-cov = ">= 2.8.1"
tox = ">= 3.9.0"
types-python-dateutil = ">= 2.8.19.14"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"
